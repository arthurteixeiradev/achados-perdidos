services:
  web:
    ports: !reset []

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docs/bonus/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - rede_interna
    restart: unless-stopped

  adminer:
    image: adminer
    profiles: ["debug"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede_interna
    restart: unless-stopped
